name: safe_notes
description: "Secure notes app built with Flutter"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  # Добавьте эти пакеты в зависимости


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.3

# Конфигурация flutter_launcher_icons и flutter_native_splash
flutter_launcher_icons:
  android: true
  image_path: "assets/logo.png"

flutter_native_splash:
  image: assets/splash.png
  color: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/splash.png
    - assets/logo.png

